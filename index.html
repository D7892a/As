<script>
    // بيانات الأصناف
    let products = [
      {id:1,name:"سندويش فلافل",category:"سندويش",price:500},
      {id:2,name:"سندويش بركر",category:"سندويش",price:1000},
      {id:3,name:"سندويش بركر بالجبن",category:"سندويش",price:1500},
      {id:4,name:"صاج فلافل",category:"صاج",price:1000},
      {id:5,name:"صاج دجاج",category:"صاج",price:2000},
      {id:6,name:"كرسبي",category:"سناك",price:2000},
      {id:7,name:"زنكر",category:"سناك",price:2000},
      {id:8,name:"تندر",category:"سناك",price:2000},
      {id:9,name:"ريزو كبير",category:"ريزو",price:4000},
      {id:10,name:"ريزو صغير",category:"ريزو",price:3000},
      {id:11,name:"بطل ماء",category:"مشروبات",price:250},
      {id:12,name:"عصير رمان",category:"مشروبات",price:500},
      {id:13,name:"عصير زبيب",category:"مشروبات",price:500}
    ];

    let cart = [];
    let cashierName = localStorage.getItem('cashierName_v1') || 'المشغل';
    let botToken = localStorage.getItem('telegram_bot_token') || '';
    let chatId = localStorage.getItem('telegram_chat_id') || '909090929';

    const FLASK_URL = 'http://127.0.0.1:5000'; // عنوان السيرفر في بايثونيستا

    // دالة الحفظ الجديدة التي تتصل بـ SQLite عبر Flask
    async function saveSaleToHistory(sale) {
      showNotification('جاري الحفظ في قاعدة البيانات...', 'info');
      try {
        const response = await fetch(`${FLASK_URL}/save_sale`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            items: sale.items,
            total: sale.total,
            cashier: cashierName,
            paid: sale.paid,
            change: sale.change
          })
        });
        
        const result = await response.json();
        if (result.status === "success") {
          showNotification('تم الحفظ في SQLite بنجاح! ✅', 'success');
          renderSalesHistory(); // تحديث السجل من السيرفر
        }
      } catch (error) {
        console.error("خطأ في الربط:", error);
        showNotification('فشل الحفظ في قاعدة البيانات. تأكد من تشغيل ملف app.py', 'error');
        
        // حفظ احتياطي محلي في حال توقف السيرفر
        const hist = JSON.parse(localStorage.getItem('sales_history_v2') || '[]');
        hist.unshift(sale);
        localStorage.setItem('sales_history_v2', JSON.stringify(hist.slice(0, 500)));
      }
      updateDailyStats();
      updateReports();
    }

    // دالة سحب السجل من SQLite
    async function renderSalesHistory() {
      const salesHistoryEl = document.getElementById('salesHistory');
      try {
        const response = await fetch(`${FLASK_URL}/get_sales`);
        const hist = await response.json();
        
        salesHistoryEl.innerHTML = '';
        if (hist.length === 0) {
          salesHistoryEl.innerHTML = '<div class="small">لا توجد مبيعات في SQLite</div>';
          return;
        }

        hist.forEach((s, idx) => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                  <div style="font-weight:700">${s.date}</div>
                  <div class="small">الكاشير: ${s.cashier_name}</div>
              </div>
              <div style="font-weight:800">${s.total_price.toLocaleString()} د.ع</div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;">
              <button class="btn secondary view-sale" onclick="printFromHistory(${idx})">إعادة طباعة</button>
            </div>
          `;
          salesHistoryEl.appendChild(div);
        });
      } catch (e) {
        salesHistoryEl.innerHTML = '<div class="small text-danger">تعذر الاتصال بقاعدة البيانات. تأكد من تشغيل البايثون.</div>';
      }
    }

    // --- بقية الدوال الأساسية للواجهة (إضافة، حذف، بحث) تبقى كما هي مع تغيير دالة الحفظ ---

    function init() {
      document.getElementById('dateNow').textContent = new Date().toLocaleString('ar-IQ');
      document.getElementById('cashierName').textContent = cashierName;
      renderMenu();
      renderCart();
      renderSalesHistory(); // التحميل من SQLite عند البدء
      setupEventListeners();
    }

    function addToCart(id, qty = 1) {
      const prod = products.find(x => x.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty += qty;
      else cart.push({id: prod.id, name: prod.name, price: prod.price, qty: qty});
      renderCart();
    }

    function renderCart() {
      const cartBody = document.getElementById('cartBody');
      cartBody.innerHTML = cart.length === 0 ? '<tr><td colspan="5" class="small">العربة فارغة</td></tr>' : '';
      cart.forEach((it, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${it.name}</td><td>${it.price}</td><td>${it.qty}</td><td>${it.price*it.qty}</td><td><button onclick="removeFromCart(${idx})" class="btn secondary">حذف</button></td>`;
        cartBody.appendChild(tr);
      });
      updateTotals();
    }

    function updateTotals() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('grandTotal').textContent = total.toLocaleString() + ' دينار';
    }

    function checkout() {
      if (cart.length === 0) return showNotification('العربة فارغة', 'error');
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
      
      saveSaleToHistory({
        items: cart,
        total: total,
        paid: paid,
        change: paid - total,
        cashier: cashierName
      });
      
      cart = [];
      renderCart();
    }

    function showNotification(msg, type) {
      const n = document.getElementById('notification');
      n.textContent = msg; n.className = `notification ${type} show`;
      setTimeout(() => n.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
